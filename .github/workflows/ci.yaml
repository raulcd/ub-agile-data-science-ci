name: CI

on:
    push:
      branches: ["main"]
    pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: python --version
      - run: pip install -r app/requirements-dev.txt
      - run: pip install -r app/requirements.txt
      - run: pytest
